<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Watchaphon - Surprise Box</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            background-color: #000;
        }

        /* --- ส่วนพื้นหลังเบลอ 30 รูป --- */
        .background-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(6, 1fr);
            filter: blur(12px) brightness(0.4);
            z-index: -1;
            gap: 0;
        }

        .background-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- ส่วนเนื้อหาหลัก --- */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 1;
            padding-bottom: 50px;
        }

        .header { margin-top: 50px; }
        h1 { 
            color: #ffffff; 
            font-size: 2.2rem; 
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8); 
            margin-bottom: 5px;
        }
        p { 
            color: #ffffff; 
            text-shadow: 1px 1px 5px rgba(0,0,0,0.8);
            font-size: 1.1rem;
        }

        .gift-box {
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.3s;
            margin: 20px 0;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }
        .gift-box:hover { transform: scale(1.2) rotate(5deg); }

        /* --- Slider ปัดซ้ายขวา (วนลูป) --- */
        .slider-container {
            width: 90%;
            max-width: 420px;
            overflow-x: auto;
            display: flex;
            gap: 15px;
            padding: 20px 0;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }
        .slider-container::-webkit-scrollbar { display: none; }

        .slide-item {
            min-width: 280px;
            height: 400px;
            background-color: white;
            border-radius: 20px;
            scroll-snap-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            border: 5px solid white;
            flex-shrink: 0;
        }

        .slide-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .wish-btn {
            background-color: #e72044;
            color: white;
            border: none;
            padding: 15px 45px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin: 30px 0;
            box-shadow: 0 10px 20px rgba(231, 32, 68, 0.5);
            transition: 0.3s;
        }
        .wish-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="background-grid">
        <img src="picture/photo1.jpg"><img src="picture/photo2.jpg"><img src="picture/photo3.jpg">
        <img src="picture/photo4.jpg"><img src="picture/photo5.jpg"><img src="picture/photo6.jpg">
        <img src="picture/photo7.jpg"><img src="picture/photo8.jpg"><img src="picture/photo9.jpg">
        <img src="picture/photo10.jpg"><img src="picture/photo11.jpg"><img src="picture/photo12.jpg">
        <img src="picture/photo13.jpg"><img src="picture/photo14.jpg"><img src="picture/photo15.jpg">
        <img src="picture/photo16.jpg"><img src="picture/photo17.jpg"><img src="picture/photo18.jpg">
        <img src="picture/photo19.jpg"><img src="picture/photo20.jpg"><img src="picture/photo21.jpg">
        <img src="picture/photo22.jpg"><img src="picture/photo23.jpg"><img src="picture/photo24.jpg">
        <img src="picture/photo25.jpg"><img src="picture/photo26.jpg"><img src="picture/photo27.jpg">
        <img src="picture/photo28.jpg"><img src="picture/photo29.jpg"><img src="picture/photo30.jpg">
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Happy Birthday Watchaphon</h1>
            <p>ลองเปิดของขวัญดูสิ ✨</p>
        </div>

        <div class="gift-box" onclick="alert('ขอให้อ้วนมีความสุขมากๆ เติบโตไปเป็นคนที่เก่งและเข้มแข็ง อยู่กับเค้าไปนานๆจ้า')">🎁</div>

        <div class="slider-container" id="slider">
            <div class="slide-item"><img src="picture/photo1.jpg"></div>
            <div class="slide-item"><img src="picture/photo2.jpg"></div>
            <div class="slide-item"><img src="picture/photo3.jpg"></div>
            <div class="slide-item"><img src="picture/photo4.jpg"></div>
            <div class="slide-item"><img src="picture/photo5.jpg"></div>
            <div class="slide-item"><img src="picture/photo6.jpg"></div>
            <div class="slide-item"><img src="picture/photo7.jpg"></div>
            <div class="slide-item"><img src="picture/photo8.jpg"></div>
            <div class="slide-item"><img src="picture/photo9.jpg"></div>
            <div class="slide-item"><img src="picture/photo10.jpg"></div>
            <div class="slide-item"><img src="picture/photo11.jpg"></div>
            <div class="slide-item"><img src="picture/photo12.jpg"></div>
            <div class="slide-item"><img src="picture/photo13.jpg"></div>
            <div class="slide-item"><img src="picture/photo14.jpg"></div>
            <div class="slide-item"><img src="picture/photo15.jpg"></div>
            <div class="slide-item"><img src="picture/photo16.jpg"></div>
            <div class="slide-item"><img src="picture/photo17.jpg"></div>
            <div class="slide-item"><img src="picture/photo18.jpg"></div>
            <div class="slide-item"><img src="picture/photo19.jpg"></div>
            <div class="slide-item"><img src="picture/photo20.jpg"></div>
            <div class="slide-item"><img src="picture/photo21.jpg"></div>
            <div class="slide-item"><img src="picture/photo22.jpg"></div>
            <div class="slide-item"><img src="picture/photo23.jpg"></div>
            <div class="slide-item"><img src="picture/photo24.jpg"></div>
            <div class="slide-item"><img src="picture/photo25.jpg"></div>
            <div class="slide-item"><img src="picture/photo26.jpg"></div>
            <div class="slide-item"><img src="picture/photo27.jpg"></div>
            <div class="slide-item"><img src="picture/photo28.jpg"></div>
            <div class="slide-item"><img src="picture/photo29.jpg"></div>
            <div class="slide-item"><img src="picture/photo30.jpg"></div>
        </div>

        <button class="wish-btn" onclick="alert('อยู่ด้วยกันไปนานๆ นะ ❤️')">กดดูความในใจ</button>
    </div>

    <script>
        const slider = document.getElementById('slider');
        
        // ฟังก์ชันทำให้ Slider วนลูปได้เรื่อยๆ
        slider.addEventListener('scroll', () => {
            const maxScrollLeft = slider.scrollWidth - slider.clientWidth;
            
            // ถ้าเลื่อนไปจนเกือบสุดด้านขวา ให้กระโดดกลับไปเริ่มที่ 0
            if (slider.scrollLeft >= maxScrollLeft - 10) {
                // หน่วงเวลานิดหนึ่งเพื่อให้ดูเนียน
                setTimeout(() => {
                    slider.scrollTo({ left: 1, behavior: 'auto' });
                }, 500);
            }
        });

        // เทคนิค Clone รูปชุดแรกไปต่อท้าย เพื่อให้เลื่อนวนลูปได้เนียนขึ้น
        const items = slider.querySelectorAll('.slide-item');
        // Clone แค่ 3 รูปแรกมาต่อท้ายก็พอครับเพื่อให้ความรู้สึกเหมือนมันวนกลับมา
        for(let i=0; i<3; i++) {
            const clone = items[i].cloneNode(true);
            slider.appendChild(clone);
        }
    </script>

</body>
</html>

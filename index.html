<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Watchaphon</title>
    <style>
        /* โค้ด CSS เดิมของคุณทั้งหมด... */
        body { margin: 0; padding: 0; min-height: 100vh; font-family: 'Arial', sans-serif; overflow-x: hidden; background-color: #000; }
        .background-grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(6, 1fr); filter: blur(15px) brightness(0.3); z-index: -1; }
        .background-grid img { width: 100%; height: 100%; object-fit: cover; }
        .main-content { display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; z-index: 1; padding: 20px; }
        h1 { color: #fff; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); margin-top: 30px; }
        .slider-wrapper { position: relative; width: 95%; max-width: 500px; margin: 20px 0; display: flex; align-items: center; justify-content: center; }
        .slider-container { width: 100%; display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth; border-radius: 20px; }
        .slider-container::-webkit-scrollbar { display: none; }
        .slide-item { min-width: 100%; height: 450px; background-color: rgba(255,255,255,0.1); scroll-snap-align: center; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .slide-item img { max-width: 100%; max-height: 100%; object-fit: contain; border: 4px solid white; border-radius: 15px; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.7); border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 10; }
        .prev-btn { left: -10px; }
        .next-btn { right: -10px; }
        .gift-box { font-size: 60px; cursor: pointer; margin: 10px; transition: 0.3s; }
        .gift-box:hover { transform: scale(1.2); }
        .wish-btn { background-color: #e72044; color: white; border: none; padding: 12px 35px; border-radius: 50px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

    <audio id="hbdSong" loop>
        <source src="picture/music.mp3" type="audio/mpeg">
    </audio>

    <div class="background-grid" id="bgGrid">
        </div>

    <div class="main-content">
        <h1>Happy Birthday Watchaphon</h1>
        
        <div class="gift-box" onclick="startSurprise()">🎁</div>

        <div class="slider-wrapper">
            <button class="nav-btn prev-btn">❮</button>
            <div class="slider-container" id="slider">
                <script>
                    for(let i=1; i<=30; i++) {
                        // เพิ่ม loading="lazy" เพื่อให้โหลดเฉพาะรูปที่มองเห็น
                        document.write(`
                            <div class="slide-item">
                                <img src="picture/photo${i}.jpg" alt="รูปที่ ${i}" loading="lazy">
                            </div>
                        `);
                    }
                </script>
            </div>
            <button class="nav-btn next-btn">❯</button>
        </div>

        <button class="wish-btn" onclick="alert('อยู่ด้วยกันไปนานๆ ไว้ไปกินของอร่อยกัน ❤️')">กดดูความในใจ</button>
    </div>

    <script>
        // 1. ฟังก์ชันเปิดกล่อง + เล่นเพลง
        function startSurprise() {
            const song = document.getElementById('hbdSong');
            song.play(); // เริ่มเล่นเพลง
            alert('เค้าขอให้อ้วนมีความสุขมากๆ ยิ้มเยอะๆ นะครับ ❤️');
        }

        // 2. โหลดพื้นหลังแบบหน่วงเวลา (เพื่อให้หน้าหลักมาไวขึ้น)
        window.addEventListener('load', () => {
            const bgGrid = document.getElementById('bgGrid');
            let bgHtml = '';
            for(let i=1; i<=30; i++) {
                bgHtml += `<img src="picture/photo${i}.jpg" loading="lazy">`;
            }
            bgGrid.innerHTML = bgHtml;
        });

        // 3. ระบบควบคุม Slider (เดิมของคุณ)
        const slider = document.getElementById('slider');
        const nextBtn = document.querySelector('.next-btn');
        const prevBtn = document.querySelector('.prev-btn');

        nextBtn.addEventListener('click', () => {
            const itemWidth = slider.querySelector('.slide-item').clientWidth + 10;
            const maxScroll = slider.scrollWidth - slider.clientWidth;
            if (slider.scrollLeft >= maxScroll - 5) {
                slider.scrollTo({ left: 0, behavior: 'smooth' });
            } else {
                slider.scrollBy({ left: itemWidth, behavior: 'smooth' });
            }
        });

        prevBtn.addEventListener('click', () => {
            const itemWidth = slider.querySelector('.slide-item').clientWidth + 10;
            if (slider.scrollLeft <= 5) {
                slider.scrollTo({ left: slider.scrollWidth, behavior: 'smooth' });
            } else {
                slider.scrollBy({ left: -itemWidth, behavior: 'smooth' });
            }
        });
    </script>
</body>
</html>
